name: iOS build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: Build for iOS Simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: GermanStudy-simulator
          path: build/Build/Products/Debug-iphonesimulator/App.app
